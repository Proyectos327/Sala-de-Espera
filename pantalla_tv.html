<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla Sala de Espera - HUMNT</title>
<style>
  :root {
    --bg-main: #0b1120;
    --bg-card: #1e293b;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --highlight: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body {
    background: var(--bg-main);
    color: var(--text-main);
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
    padding: 1.8vh 2.5vw;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.5vw;
    border-bottom: 2px solid #334155;
    padding-bottom: 1.2vh;
  }
  .logos-institucionales {
    display: flex;
    align-items: center;
    gap: 1vw;
    background: #ffffff;
    padding: 0.6vh 1vw;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    flex-shrink: 0;
  }
  .logos-institucionales img {
    display: block;
    object-fit: contain;
  }
  .logo-mpps {
    height: 5.5vh;
    max-width: 24vw;
  }
  .separador-logos {
    width: 2px;
    height: 4.5vh;
    background: #cbd5e1;
  }
  .logo-humnt {
    height: 6.2vh;
    max-width: 14vw;
  }

  .titulo-bloque {
    flex: 1;
    min-width: 0;
    padding: 0 0.5vw;
  }
  header h1 {
    font-size: 2vw;
    letter-spacing: 0.5px;
    color: var(--accent);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .estado-hora {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .estado-red { font-size: 1vw; color: #34d399; margin-right: 1.2vw; white-space: nowrap; }
  #reloj { font-size: 2.2vw; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

  main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 2.5vw;
    padding: 2.5vh 0;
    align-items: stretch;
    min-height: 0;
  }

  .turno-actual {
    background: linear-gradient(145deg, #1e293b, #0f172a);
    border: 3px solid var(--accent);
    box-shadow: 0 0 35px var(--accent-glow);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 3vh 2vw;
  }
  .turno-actual.parpadeo {
    animation: pulso 1.2s ease-in-out 3;
    border-color: var(--highlight);
  }
  @keyframes pulso {
    0%, 100% { transform: scale(1); box-shadow: 0 0 35px var(--accent-glow); }
    50% { transform: scale(1.02); box-shadow: 0 0 60px rgba(16, 185, 129, 0.7); }
  }
  .etiqueta {
    font-size: 1.9vw;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 2vh;
  }
  .nombre-paciente {
    font-size: 4.5vw;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 3vh;
    word-break: break-word;
  }
  .modulo-destino {
    background: var(--highlight);
    color: #022c22;
    font-size: 2.9vw;
    font-weight: 800;
    padding: 1.5vh 3vw;
    border-radius: 14px;
    text-transform: uppercase;
  }
  .nota-extra {
    margin-top: 2.5vh;
    font-size: 1.7vw;
    color: var(--text-muted);
  }

  .historial {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 2.2vh 2vw;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .historial h2 {
    font-size: 1.7vw;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 1.8vh;
    border-bottom: 1px solid #334155;
    padding-bottom: 1vh;
  }
  .lista-historial {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 1.4vh;
    overflow: hidden;
  }
  .item-historial {
    background: #0f172a;
    padding: 1.6vh 1.5vw;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 6px solid #475569;
  }
  .item-historial span:first-child { font-size: 1.7vw; font-weight: 600; }
  .item-historial span:last-child { font-size: 1.5vw; color: var(--accent); font-weight: 700; }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    font-size: 1.2vw;
    border-top: 1px solid #334155;
    padding-top: 1vh;
  }
  #btn-audio {
    background: #059669;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1vw;
    font-weight: 600;
  }
</style>
</head>
<body>

  <header>
    <div class="logos-institucionales">
      <img
        src="./logo 1613 x 232 Png.png"
        alt="Gobierno Bolivariano de Venezuela - Ministerio del Poder Popular para la Salud"
        class="logo-mpps"
      >
      <div class="separador-logos"></div>
      <img
        src="./904 x 404 (2) Png.png"
        alt="HUMNT - Hospital Universitario Dr. Manuel Núñez Tovar"
        class="logo-humnt"
      >
    </div>

    <div class="titulo-bloque">
      <h1 id="titulo-sala">Sala de Espera</h1>
    </div>

    <div class="estado-hora">
      <span class="estado-red" id="estado-sync">● Sincronizando</span>
      <div id="reloj">00:00:00</div>
    </div>
  </header>

  <main>
    <section class="turno-actual" id="caja-actual">
      <div class="etiqueta">Familiares de:</div>
      <div class="nombre-paciente" id="nombre-actual">En espera...</div>
      <div class="modulo-destino" id="modulo-actual">---</div>
      <div class="nota-extra" id="nota-actual">Por favor, manténgase atento a la pantalla</div>
    </section>

    <section class="historial">
      <h2>Llamados Anteriores</h2>
      <ul class="lista-historial" id="lista-historial"></ul>
    </section>
  </main>

  <footer>
    <span>Hospital Universitario Dr. Manuel Núñez Tovar — Atención por orden de llamado</span>
    <button id="btn-audio" onclick="activarSonido()">🔊 Timbre activo</button>
  </footer>

<script>
  const DB_URL = 'https://saladeespera-68e30-default-rtdb.firebaseio.com/sala_espera.json';
  const INTERVALO_MS = 5000; // Consulta cada 5 segundos

  let audioCtx = null;
  let timbreHabilitado = true;
  let ultimoIdLlamado = null;
  let ultimaFirmaDatos = null;

  function inicializarAudio() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function actualizarBotonAudio() {
    const btn = document.getElementById('btn-audio');
    if (timbreHabilitado) {
      btn.textContent = '🔊 Timbre activo';
      btn.style.background = '#059669';
    } else {
      btn.textContent = '🔇 Timbre silenciado';
      btn.style.background = '#475569';
    }
  }

  function activarSonido() {
    timbreHabilitado = !timbreHabilitado;
    actualizarBotonAudio();
    if (timbreHabilitado) {
      inicializarAudio();
      tocarTimbre();
    }
  }

  ['click', 'touchstart', 'keydown'].forEach(evt => {
    document.addEventListener(evt, () => {
      if (timbreHabilitado) inicializarAudio();
    }, { passive: true });
  });

  function tocarTimbre() {
    if (!timbreHabilitado) return;
    inicializarAudio();
    if (!audioCtx) return;

    const ahora = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ahora);
    osc.frequency.setValueAtTime(880, ahora + 0.18);
    gain.gain.setValueAtTime(0.35, ahora);
    gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.85);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(ahora);
    osc.stop(ahora + 0.85);
  }

  function actualizarReloj() {
    document.getElementById('reloj').textContent = new Date().toLocaleTimeString('es-ES');
  }
  setInterval(actualizarReloj, 1000);
  actualizarReloj();
  inicializarAudio();
  actualizarBotonAudio();

  function renderizar(data) {
    const estadoEl = document.getElementById('estado-sync');
    estadoEl.textContent = '● En línea';
    estadoEl.style.color = '#34d399';

    if (!data) return;

    const firmaActual = JSON.stringify(data);
    if (firmaActual === ultimaFirmaDatos) return;
    ultimaFirmaDatos = firmaActual;

    if (data.tituloSala) {
      document.getElementById('titulo-sala').textContent = data.tituloSala;
    }

    if (data.actual) {
      document.getElementById('nombre-actual').textContent = data.actual.nombre || '---';
      document.getElementById('modulo-actual').textContent = data.actual.modulo || '---';
      document.getElementById('nota-actual').textContent = data.actual.nota || '';

      if (data.actual.id !== ultimoIdLlamado) {
        ultimoIdLlamado = data.actual.id;
        const caja = document.getElementById('caja-actual');
        caja.classList.remove('parpadeo');
        void caja.offsetWidth;
        caja.classList.add('parpadeo');
        tocarTimbre();
      }
    } else {
      document.getElementById('nombre-actual').textContent = 'En espera...';
      document.getElementById('modulo-actual').textContent = '---';
      document.getElementById('nota-actual').textContent = '';
    }

    const lista = document.getElementById('lista-historial');
    lista.innerHTML = '';
    const hist = Array.isArray(data.historial) ? data.historial : [];
    hist.slice(0, 5).forEach(item => {
      const li = document.createElement('li');
      li.className = 'item-historial';
      li.innerHTML = `<span>${item.nombre}</span><span>${item.modulo}</span>`;
      lista.appendChild(li);
    });
  }

  async function consultarCambios() {
    try {
      const res = await fetch(DB_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      renderizar(data);
    } catch (err) {
      const estadoEl = document.getElementById('estado-sync');
      estadoEl.textContent = '⚠ Reconectando...';
      estadoEl.style.color = '#f87171';
    }
  }

  consultarCambios();
  setInterval(consultarCambios, INTERVALO_MS);
</script>
</body>
</html>
